[package]
name = "cce-remote"
version = "0.1.0"
edition = "2021"
description = "Phone trackpad + keyboard for the cce desktop: serves a web UI and bridges WebSocket input events to the compositor control socket"
license = "GPL-3.0"

[dependencies]
# The compositor's socket names and the windows --json line (ipc::ctl);
# GUI-free, without the KDL config.
cce-core = { git = "https://github.com/lsgalante/cce-core.git", rev = "5b8dcb30f1b0d7d607ab49d637069560eca0cb14", default-features = false, features = ["json"] }
tungstenite = "0.21"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
jpeg-encoder = "0.6"
rustix = { version = "0.38", features = ["event"] }
