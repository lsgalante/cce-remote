<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cce remote</title>
<!-- maximum-scale=1 also stops iOS zooming in when the keyboard's textarea
     takes focus. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14151c">
<style>
  html, body { margin: 0; height: 100%; background: #14151c; overflow: hidden; overscroll-behavior: none; }
  /* The canvas fills the screen, the safe areas (notch, status bar, home
     indicator) included, and ends where the keyboard begins (--kb, set by
     app.js from the visual viewport). The app keeps its controls clear of
     the safe areas itself, reading them from #safe below (src/web/app.rs,
     safe_insets), so its plate reaches the screen's edges. */
  #app {
    position: fixed;
    top: 0; right: 0; bottom: var(--kb, 0px); left: 0;
    width: 100%; height: calc(100% - var(--kb, 0px));
    display: block; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  /* The safe areas, as padding the app can read. */
  #safe { position: fixed; visibility: hidden; pointer-events: none; top: 0; left: 0;
          padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* The phone keyboard's target (src/web/kb.rs): focusable but out of
     sight. Not display:none, which could not take focus. */
  #kb { position: absolute; opacity: 0.02; width: 1px; height: 1px; left: -10px; top: -10px; font-size: 16px; }
  #note { position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
          color: #ccccd4; font: 16px/1.5 ui-monospace, Menlo, monospace; text-align: center; }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="safe"></div>
<textarea id="kb" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<div id="note"></div>
<script type="module" src="/app.js?v=__V__"></script>
</body>
</html>
