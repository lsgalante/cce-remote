<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cce remote</title>
<!-- maximum-scale=1 also stops iOS zooming in when the keyboard's textarea
     takes focus. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14151c">
<style>
  html, body { margin: 0; height: 100%; background: #14151c; overflow: hidden; overscroll-behavior: none; }
  /* The canvas fills the safe area and ends where the keyboard begins
     (--kb, set by app.js from the visual viewport); the app lays itself
     out in whatever box this gives it. */
  #app {
    position: fixed;
    top: env(safe-area-inset-top); right: env(safe-area-inset-right);
    bottom: max(env(safe-area-inset-bottom), var(--kb, 0px)); left: env(safe-area-inset-left);
    width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
    height: calc(100% - env(safe-area-inset-top) - max(env(safe-area-inset-bottom), var(--kb, 0px)));
    display: block; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  /* The phone keyboard's target (src/web/kb.rs): focusable but out of
     sight. Not display:none, which could not take focus. */
  #kb { position: absolute; opacity: 0.02; width: 1px; height: 1px; left: -10px; top: -10px; font-size: 16px; }
  #note { position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
          color: #ccccd4; font: 16px/1.5 ui-monospace, Menlo, monospace; text-align: center; }
</style>
</head>
<body>
<canvas id="app"></canvas>
<textarea id="kb" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<div id="note"></div>
<script type="module" src="/app.js?v=__V__"></script>
</body>
</html>
