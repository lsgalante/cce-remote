<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>cce remote</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; overflow: hidden; background: #14151c; color: #ccccd4;
               font-family: ui-monospace, Menlo, monospace; }
  body { display: flex; flex-direction: column;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #bar { display: flex; gap: 6px; padding: 8px; flex-wrap: wrap; }
  #bar button { flex: 1 1 auto; min-width: 44px; padding: 10px 6px; font-size: 13px;
                font-family: inherit; color: #ccccd4; background: #23252f;
                border: 1px solid #2e3140; border-radius: 8px; }
  #bar button.on { background: #25626c; border-color: #337fc0; }
  #pad { flex: 1; margin: 0 8px; background: #191b23; border: 1px solid #2e3140;
         border-radius: 12px; touch-action: none; position: relative; }
  #pad .hint { position: absolute; inset: 0; display: flex; align-items: center;
               justify-content: center; color: #4a4d5c; font-size: 12px; text-align: center;
               pointer-events: none; }
  #clicks { display: flex; gap: 8px; padding: 8px; }
  #clicks button { flex: 1; padding: 16px; font-size: 13px; font-family: inherit;
                   color: #ccccd4; background: #23252f; border: 1px solid #2e3140;
                   border-radius: 10px; }
  #clicks button:active, #bar button:active { background: #2c5f69; }
  #kb { position: absolute; opacity: 0.02; width: 1px; height: 1px; left: -10px; top: -10px; }
  /* Zoom/pan transform lives on the WRAPPER, never the <img>: iOS Safari
     stops repainting a GPU-promoted layer when its multipart-MJPEG <img>
     updates (black square). The img stays in the normal paint path. */
  #screenwrap { display: none; position: absolute; inset: 0; z-index: 2;
                transform-origin: 0 0; border-radius: 12px; overflow: hidden; }
  #pad.view #screenwrap { display: block; }
  #screen { display: block; width: 100%; height: 100%;
            object-fit: contain; background: #0c0d12; }
  #vcursor { display: none; position: absolute; width: 14px; height: 14px; z-index: 3;
             pointer-events: none; border: 2px solid #7dffff; border-radius: 50%;
             box-shadow: 0 0 4px #000; margin: -7px 0 0 -7px; }
  #pad.view #vcursor.on { display: block; }
  #pad.view #screen { display: block; }
  #pad.view .hint { display: none; }
  #switcher, #menu { display: none; position: absolute; inset: 8px; overflow-y: auto;
              background: rgba(20,21,28,0.96); border: 1px solid #2e3140;
              border-radius: 10px; z-index: 5; -webkit-overflow-scrolling: touch; }
  #switcher.show, #menu.show { display: block; }
  #switcher .win, #menu .win { padding: 14px 14px; border-bottom: 1px solid #23252f;
                   display: flex; gap: 10px; align-items: baseline; }
  #switcher .win .t, #menu .win .t { flex: 1; overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; font-size: 14px; }
  #switcher .win .a { color: #6a6d7c; font-size: 11px; }
  #switcher .win.focused { background: #1d3a44; }
  #switcher .win.focused .t { color: #7dffff; }
  #switcher .empty { padding: 20px; color: #4a4d5c; text-align: center; font-size: 12px; }
  #preview { display: none; margin: 0 8px 6px; padding: 8px 10px; min-height: 36px;
             background: #191b23; border: 1px solid #2e3140; border-radius: 8px;
             font-size: 15px; color: #cfe8e8; white-space: pre-wrap; word-break: break-all; }
  #preview.show { display: block; }
  #preview.show::after { content: "▍"; color: #7dffff; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #status { position: fixed; top: 4px; right: 10px; font-size: 10px; color: #4a4d5c; }
</style>
</head>
<body>
<div id="status">·</div>
<div id="bar">
  <button data-k="1">esc</button>
  <button data-k="15">tab</button>
  <button data-mod="29">ctrl</button>
  <button data-mod="56">alt</button>
  <button data-mod="125">sup</button>
  <button data-k="105">←</button>
  <button data-k="103">↑</button>
  <button data-k="108">↓</button>
  <button data-k="106">→</button>
  <button id="wbtn">☰</button>
  <button id="mbtn">⋯</button>
  <button id="kbtn">⌨</button>
</div>
<div id="preview"></div>
<div id="pad"><div class="hint">drag = move · tap = click · 2-finger drag = scroll<br>2-finger tap = right click · hold = drag</div>
  <div id="screenwrap"><img id="screen" draggable="false"></div>
  <div id="vcursor"></div>
  <div id="switcher"></div>
  <div id="menu"></div>
</div>
<div id="clicks">
  <button id="lclick">left</button>
  <button id="rclick">right</button>
</div>
<textarea id="kb" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<script>
"use strict";
// ── WebSocket + pairing ──────────────────────────────────────────────
// First frame must be `auth <pin>` (the PIN cce-remote prints at startup).
// Remembered in localStorage after the first successful pairing.
let ws = null, authed = false;
const status = document.getElementById("status");
function askPin(msg) {
  const pin = window.prompt(msg || "cce-remote pairing PIN (shown in the server terminal):");
  if (pin) localStorage.setItem("cce-remote-pin", pin.trim());
  return pin ? pin.trim() : null;
}
function connect() {
  authed = false;
  ws = new WebSocket("ws://" + location.host + "/ws");
  ws.onopen = () => {
    const pin = localStorage.getItem("cce-remote-pin") || askPin();
    if (pin) ws.send("auth " + pin); else ws.close();
  };
  ws.onmessage = e => {
    if (typeof e.data === "string" && e.data.startsWith("windows ")) { renderSwitcher(e.data.slice(8)); }
    else if (typeof e.data === "string" && e.data.startsWith("ploc ")) { updateCursorMarker(e.data.slice(5)); }
    else if (e.data === "auth ok") { authed = true; status.textContent = "●"; status.style.color = "#5fbf6f"; }
    else if (e.data === "auth fail") {
      localStorage.removeItem("cce-remote-pin");
      askPin("Wrong PIN — try again:");
      // server closed on failure; onclose reconnects with the new PIN
    }
  };
  ws.onclose = () => { authed = false; status.textContent = "○"; status.style.color = "#bf5f5f"; setTimeout(connect, 1000); };
}
connect();
function send(s) { if (authed && ws && ws.readyState === 1) ws.send(s); }

// ── Trackpad ─────────────────────────────────────────────────────────
const pad = document.getElementById("pad");
// forward decls used by the pad handlers; the panels are wired further down.
// "sw" now means any overlay panel (window switcher or the ⋯ menu).
function swContains(el) {
  return document.getElementById("switcher").contains(el)
      || document.getElementById("menu").contains(el);
}
function swHide() {
  document.getElementById("switcher").classList.remove("show");
  document.getElementById("menu").classList.remove("show");
}
// SCROLL is finger-px → wl axis units (~surface px): 0.8 ≈ natural 1:1 feel.
const ACCEL = 1.6, SCROLL = 0.8;
// Touch state: one finger moves, two fingers scroll; short still touches
// click; a long-press starts a held drag (release on lift).
let touches = new Map(), moved = 0, startT = 0, maxFingers = 0, startX = 0, startY = 0;
let dragging = false, dragTimer = null, pendDx = 0, pendDy = 0, pendSy = 0, flushT = null;

// ── Window view mode: live MJPEG stream of the focused window; taps
// click it. The <img> renders /stream (multipart/x-mixed-replace)
// natively; winRect for tap mapping is kept fresh by polling `wl` over
// the WS (the stream follows focus server-side).
let viewMode = false, winRect = null, rectTimer = null, cursorTimer = null;
const screenEl = document.getElementById("screen");
function updateRect(wins) {
  const f = wins.find(w => w.focused && w.mode !== "Status");
  if (f) winRect = { id: f.id, x: f.x, y: f.y, w: f.w, h: f.h };
}
// View zoom/pan (two-finger pinch/drag in view mode): a pure client-side
// transform of the streamed image. Uniform scale+translate means
// getBoundingClientRect reflects it, so mapToWindow stays correct zoomed.
let vZoom = 1, vPanX = 0, vPanY = 0, pinch = null;
const screenWrap = document.getElementById("screenwrap");
function applyViewTransform() {
  screenWrap.style.transform = "translate(" + vPanX + "px," + vPanY + "px) scale(" + vZoom + ")";
}
function resetViewTransform() { vZoom = 1; vPanX = 0; vPanY = 0; pinch = null; applyViewTransform(); }
function clampPan() {
  const r = pad.getBoundingClientRect();
  vPanX = Math.min(Math.max(vPanX, r.width - r.width * vZoom), 0);
  vPanY = Math.min(Math.max(vPanY, r.height - r.height * vZoom), 0);
  if (vZoom <= 1.001) { vZoom = 1; vPanX = 0; vPanY = 0; }
}

// The compositor's frames carry no cursor (they're surface textures), so
// view mode draws its own marker: poll pointer-location over the WS and
// place the ring via the inverse of the tap mapping.
const vcursor = document.getElementById("vcursor");
function updateCursorMarker(coords) {
  if (!viewMode || !winRect || !screenEl.naturalWidth) { vcursor.classList.remove("on"); return; }
  const [lx, ly] = coords.split(" ").map(Number);
  const u = (lx - winRect.x) / winRect.w, v = (ly - winRect.y) / winRect.h;
  if (!(u >= 0 && u <= 1 && v >= 0 && v <= 1)) { vcursor.classList.remove("on"); return; }
  const box = screenEl.getBoundingClientRect();
  const scale = Math.min(box.width / screenEl.naturalWidth, box.height / screenEl.naturalHeight);
  const dw = screenEl.naturalWidth * scale, dh = screenEl.naturalHeight * scale;
  const padBox = pad.getBoundingClientRect();
  vcursor.style.left = (box.left - padBox.left + (box.width - dw) / 2 + u * dw) + "px";
  vcursor.style.top = (box.top - padBox.top + (box.height - dh) / 2 + v * dh) + "px";
  vcursor.classList.add("on");
}

// touch point (viewport px) → layout px inside the focused window,
// accounting for the contain-fit letterbox. null when off the image.
function mapToWindow(cx, cy) {
  if (!winRect || !screenEl.naturalWidth) return null;
  const box = screenEl.getBoundingClientRect();
  const scale = Math.min(box.width / screenEl.naturalWidth, box.height / screenEl.naturalHeight);
  const dw = screenEl.naturalWidth * scale, dh = screenEl.naturalHeight * scale;
  const ox = box.left + (box.width - dw) / 2, oy = box.top + (box.height - dh) / 2;
  const u = (cx - ox) / dw, v = (cy - oy) / dh;
  if (u < 0 || u > 1 || v < 0 || v > 1) return null;
  return [(winRect.x + u * winRect.w).toFixed(1), (winRect.y + v * winRect.h).toFixed(1)];
}

function flush() {
  flushT = null;
  if (pendDx || pendDy) { send("m " + (pendDx * ACCEL).toFixed(1) + " " + (pendDy * ACCEL).toFixed(1)); pendDx = pendDy = 0; }
  if (pendSy) { send("s " + pendSy.toFixed(3) + " 0"); pendSy = 0; }
}
function queueFlush() { if (!flushT) flushT = setTimeout(flush, 12); }

pad.addEventListener("touchstart", e => {
  // Touches on the window-switcher panel are its own (row taps, list
  // scrolling) — never trackpad input. Any other pad touch dismisses it.
  if (swContains(e.target)) return;
  swHide();
  e.preventDefault();
  for (const t of e.changedTouches) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
  maxFingers = Math.max(maxFingers, touches.size);
  if (touches.size === 1) {
    moved = 0; startT = Date.now(); pinch = null;
    const t0 = e.changedTouches[0];
    startX = t0.clientX; startY = t0.clientY;
    dragTimer = setTimeout(() => {
      if (moved >= 8) return;
      if (viewMode) {
        // long-press in view mode = right click at the spot
        const m = mapToWindow(startX, startY);
        if (m) { send("tapr " + m[0] + " " + m[1]); navigator.vibrate && navigator.vibrate(15); }
      } else {
        dragging = true; send("b left down"); navigator.vibrate && navigator.vibrate(15);
      }
    }, 350);
  } else { clearTimeout(dragTimer); }
}, { passive: false });

pad.addEventListener("touchmove", e => {
  if (swContains(e.target)) return;
  e.preventDefault();
  if (touches.size === 1) {
    const t = e.changedTouches[0], p = touches.get(t.identifier);
    if (!p) return;
    // one-finger drag = relative pointer motion, in BOTH modes
    pendDx += t.clientX - p.x; pendDy += t.clientY - p.y; queueFlush();
    moved += Math.abs(t.clientX - p.x) + Math.abs(t.clientY - p.y);
    touches.set(t.identifier, { x: t.clientX, y: t.clientY });
  } else if (touches.size === 2) {
    let dy = 0, n = 0;
    for (const t of e.changedTouches) {
      const p = touches.get(t.identifier);
      if (p) { dy += t.clientY - p.y; n++; touches.set(t.identifier, { x: t.clientX, y: t.clientY }); }
    }
    if (n) moved += Math.abs(dy);
    if (viewMode) {
      // two fingers in view mode: pinch-zoom + pan of the view
      const pts = [...touches.values()];
      if (pts.length === 2) {
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const cx = (pts[0].x + pts[1].x) / 2, cy = (pts[0].y + pts[1].y) / 2;
        if (pinch && pinch.dist > 0) {
          const nz = Math.min(8, Math.max(1, vZoom * (dist / pinch.dist)));
          const applied = nz / vZoom;
          const r = pad.getBoundingClientRect();
          const px = cx - r.left, py = cy - r.top;
          // zoom about the pinch centroid, then follow its drag
          vPanX = px - (px - vPanX) * applied + (cx - pinch.cx);
          vPanY = py - (py - vPanY) * applied + (cy - pinch.cy);
          vZoom = nz;
          clampPan();
          applyViewTransform();
        }
        pinch = { dist, cx, cy };
      }
    } else if (n) {
      // trackpad mode: two-finger drag scrolls (natural direction)
      pendSy += (-dy / n) * SCROLL;
      queueFlush();
    }
  }
}, { passive: false });

pad.addEventListener("touchend", e => {
  if (swContains(e.target)) return;
  e.preventDefault();
  for (const t of e.changedTouches) touches.delete(t.identifier);
  if (touches.size < 2) pinch = null;
  if (touches.size > 0) return;
  clearTimeout(dragTimer);
  flush();
  if (dragging) { send("b left up"); dragging = false; }
  else if (moved < 10 && Date.now() - startT < 300) {
    if (viewMode) {
      if (maxFingers < 2) {
        const t = e.changedTouches[0];
        const m = mapToWindow(t.clientX, t.clientY);
        if (m) send("tap " + m[0] + " " + m[1]);
      }
    } else {
      send(maxFingers >= 2 ? "b right click" : "b left click");
    }
  }
  maxFingers = 0;
}, { passive: false });
pad.addEventListener("touchcancel", () => { touches.clear(); clearTimeout(dragTimer); if (dragging) { send("b left up"); dragging = false; } maxFingers = 0; });

document.getElementById("lclick").addEventListener("click", () => send("b left click"));
document.getElementById("rclick").addEventListener("click", () => send("b right click"));

// ── View mode + the ⋯ menu ───────────────────────────────────────────
const mbtn = document.getElementById("mbtn");
function setViewMode(on) {
  if (viewMode === on) return;
  viewMode = on;
  mbtn.classList.toggle("on", viewMode);
  pad.classList.toggle("view", viewMode);
  resetViewTransform();
  if (viewMode) {
    const pin = localStorage.getItem("cce-remote-pin") || "";
    screenEl.src = "/stream?pin=" + encodeURIComponent(pin);
    send("wl"); // prime winRect
    rectTimer = setInterval(() => send("wl"), 2000);
    cursorTimer = setInterval(() => send("pl"), 250);
  } else {
    clearInterval(rectTimer);
    clearInterval(cursorTimer);
    vcursor.classList.remove("on");
    screenEl.src = "data:,"; // closes the stream connection
  }
}
const menuEl = document.getElementById("menu");
function menuRow(label, danger, fn) {
  const row = document.createElement("div");
  row.className = "win";
  const t = document.createElement("span");
  t.className = "t";
  t.textContent = label;
  if (danger) t.style.color = "#e08a8a";
  row.appendChild(t);
  row.addEventListener("click", () => { swHide(); fn(); });
  menuEl.appendChild(row);
}
mbtn.addEventListener("click", () => {
  if (menuEl.classList.contains("show")) { swHide(); return; }
  swHide();
  menuEl.innerHTML = "";
  menuRow(viewMode ? "Switch to trackpad" : "Show focused window (live view)", false,
    () => setViewMode(!viewMode));
  menuRow("Restart compositor", true, () => {
    if (window.confirm("Restart the compositor? Every app in the session will close, then the session relaunches.")) {
      send("cmd restart-compositor");
    }
  });
  menuEl.classList.add("show");
});

// ── Window switcher ──────────────────────────────────────────────────
const switcher = document.getElementById("switcher");
let wantSwitcher = false;
document.getElementById("wbtn").addEventListener("click", () => {
  if (switcher.classList.contains("show")) { switcher.classList.remove("show"); return; }
  wantSwitcher = true;
  send("wl"); // reply renders + shows the panel
});
function renderSwitcher(json) {
  let wins = [];
  try { wins = JSON.parse(json); } catch (_) {}
  updateRect(wins); // every wl reply refreshes the tap-mapping rect
  if (!wantSwitcher) return;
  wantSwitcher = false;
  // real app windows only: no status-bar modules, no child surfaces
  wins = wins.filter(w => w.mode !== "Status" && !w.has_parent && !w.minimized);
  switcher.innerHTML = "";
  if (!wins.length) {
    switcher.innerHTML = '<div class="empty">no windows</div>';
  }
  for (const w of wins) {
    const row = document.createElement("div");
    row.className = "win" + (w.focused ? " focused" : "");
    const t = document.createElement("span"); t.className = "t"; t.textContent = w.title || w.app_id;
    const a = document.createElement("span"); a.className = "a"; a.textContent = w.app_id;
    row.append(t, a);
    row.addEventListener("click", () => {
      send("wf " + w.id);
      swHide();
    });
    switcher.appendChild(row);
  }
  switcher.classList.add("show");
}

// ── Bar keys + sticky modifiers ──────────────────────────────────────
for (const b of document.querySelectorAll("#bar button[data-k]"))
  b.addEventListener("click", () => send("k " + b.dataset.k));
for (const b of document.querySelectorAll("#bar button[data-mod]"))
  b.addEventListener("click", () => {
    const on = b.classList.toggle("on");
    send((on ? "kd " : "ku ") + b.dataset.mod);
  });

// ── Keyboard: iOS software keyboard via a hidden textarea ────────────
// beforeinput is the reliable path on iOS (keydown often reports 229).
const kb = document.getElementById("kb");
document.getElementById("kbtn").addEventListener("click", () => {
  if (document.activeElement === kb) { kb.blur(); } else { kb.focus(); }
});
// iOS never fires deleteContentBackward on an EMPTY field — keep sentinel
// padding in the textarea (cursor at the end) so backspace always has
// something to "delete". beforeinput preventDefault keeps it untouched;
// the re-arm below repairs any drift (autocorrect ghosts etc.).
const SENTINEL = "········";
function armKb() { kb.value = SENTINEL; kb.setSelectionRange(SENTINEL.length, SENTINEL.length); }
// Local echo of what's been typed — cleared on Enter or keyboard close.
// (The target app shows the real text; this is feedback for eyes-on-phone.)
const preview = document.getElementById("preview");
let typed = "";
function updPreview() {
  preview.textContent = typed;
  preview.classList.toggle("show", document.activeElement === kb);
}
kb.addEventListener("focus", () => { armKb(); updPreview(); });
kb.addEventListener("blur", () => { typed = ""; updPreview(); });
// US-layout char → [evdev keycode, needs shift]
const KEYS = {};
"abcdefghijklmnopqrstuvwxyz".split("").forEach((c, i) => {
  KEYS[c] = [[30,48,46,32,18,33,34,35,23,36,37,38,50,49,24,25,16,19,31,20,22,47,17,45,21,44][i], false];
  KEYS[c.toUpperCase()] = [KEYS[c][0], true];
});
"1234567890".split("").forEach((c, i) => { KEYS[c] = [2 + i, false]; });
Object.assign(KEYS, {
  " ": [57,false], "-": [12,false], "=": [13,false], "[": [26,false], "]": [27,false],
  "\\": [43,false], ";": [39,false], "'": [40,false], "`": [41,false], ",": [51,false],
  ".": [52,false], "/": [53,false],
  "!": [2,true], "@": [3,true], "#": [4,true], "$": [5,true], "%": [6,true], "^": [7,true],
  "&": [8,true], "*": [9,true], "(": [10,true], ")": [11,true], "_": [12,true], "+": [13,true],
  "{": [26,true], "}": [27,true], "|": [43,true], ":": [39,true], "\"": [40,true],
  "~": [41,true], "<": [51,true], ">": [52,true], "?": [53,true],
});
function typeChar(ch) {
  const k = KEYS[ch];
  if (!k) return;
  if (k[1]) { send("kd 42"); send("k " + k[0]); send("ku 42"); }
  else { send("k " + k[0]); }
  typed += ch;
}
kb.addEventListener("beforeinput", e => {
  e.preventDefault();
  switch (e.inputType) {
    case "insertText":
    case "insertReplacementText":
      for (const ch of (e.data || "")) typeChar(ch);
      break;
    case "insertLineBreak": send("k 28"); typed = ""; break;
    case "deleteContentBackward": send("k 14"); typed = typed.slice(0, -1); break;
    case "deleteWordBackward": {
      // one backspace per removed char, so desktop and preview stay in sync
      const rest = typed.replace(/\S+\s*$/, "");
      const n = Math.max(1, typed.length - rest.length);
      for (let i = 0; i < n; i++) send("k 14");
      typed = rest;
      break;
    }
    case "deleteContentForward": send("k 111"); break;
  }
  updPreview();
});
// repair sentinel drift while the keyboard is up
setInterval(() => { if (document.activeElement === kb && kb.value !== SENTINEL) armKb(); }, 1000);
</script>
</body>
</html>
